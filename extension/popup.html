<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OVERHUE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 280px;
      color: #2a241c;
      font-family: "IBM Plex Sans KR", sans-serif;
      background: #f4ebe0;
      padding: 16px;
    }
    h1 {
      font-family: Georgia, serif;
      font-size: 22px;
      margin: 0 0 4px;
      text-align: center;
    }
    p { margin: 0 0 12px; text-align: center; color: #7a7064; font-size: 12px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 11px 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin: 0 0 8px;
      font-family: inherit;
    }
    .primary { background: #2a241c; color: #fffdf8; }
    .ghost { background: #fffdf8; color: #2a241c; }
  </style>
</head>
<body>
  <h1>OVERHUE</h1>
  <p>겹친 색을 스케치북에 맞추세요</p>
  <button class="primary" id="daily" type="button">오늘의 스케치</button>
  <button class="ghost" id="play" type="button">이어서 칠하기</button>
  <script src="popup.js"></script>
</body>
</html>
