<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OVERHUE 다운로드</title>
  <meta name="description" content="OVERHUE를 App Store 또는 Google Play에서 받으세요." />
  <meta name="theme-color" content="#ebe0d2" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      color: #2a241c;
      font-family: "IBM Plex Sans KR", sans-serif;
      background:
        radial-gradient(720px 440px at 50% -12%, #fffaf3, transparent 58%),
        linear-gradient(180deg, #f4ebe0 0%, #ebe0d2 100%);
    }
    main {
      width: min(420px, 100%);
      padding: 36px 28px 28px;
      border-radius: 28px;
      background: #fffdf8;
      box-shadow: 0 14px 40px rgba(60, 42, 20, .10);
      text-align: center;
    }
    h1 {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-size: 40px;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    .tag { margin: 10px 0 0; color: #7a7064; font-size: 15px; line-height: 1.5; }
    .status { min-height: 22px; margin: 18px 0 0; color: #8a6a00; font-size: 14px; }
    .stores { display: grid; gap: 10px; margin-top: 8px; }
    a.store {
      display: block;
      padding: 12px 16px;
      border-radius: 18px;
      background: #2a241c;
      color: #fffdf8;
      text-decoration: none;
    }
    a.store span { display: block; font-size: 12px; opacity: 0.72; }
    a.store strong { display: block; margin-top: 2px; font-size: 16px; }
    .back { display: inline-block; margin-top: 18px; color: #7a7064; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>OVERHUE</h1>
    <p class="tag">종이 위에 물감을 겹쳐 칠하는 색 퍼즐</p>
    <p class="status" id="status"></p>
    <div class="stores">
      <a class="store" id="ios" href="https://apps.apple.com/app/overhue/id6817478231">
        <span>다운로드</span>
        <strong>App Store</strong>
      </a>
      <a class="store" id="android" href="https://play.google.com/store/apps/details?id=com.overhue.feel">
        <span>다운로드</span>
        <strong>Google Play</strong>
      </a>
    </div>
    <a class="back" href="../">웹에서 하기</a>
  </main>
  <script>
    const APP_STORE_URL = "https://apps.apple.com/app/overhue/id6817478231";
    const PLAY_URL = "https://play.google.com/store/apps/details?id=com.overhue.feel";
    const params = new URLSearchParams(location.search);
    const forced = params.get("os");

    function device() {
      if (forced === "ios" || forced === "android") return forced;
      const ua = navigator.userAgent || "";
      const ipad = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      if (/iPhone|iPad|iPod/i.test(ua) || ipad) return "ios";
      if (/Android/i.test(ua)) return "android";
      return "desktop";
    }

    const os = device();
    if (os === "ios" || os === "android") {
      const url = os === "ios" ? APP_STORE_URL : PLAY_URL;
      document.getElementById("status").textContent =
        (os === "ios" ? "App Store" : "Google Play") + "로 이동하고 있어요";
      if (!params.has("stay")) location.replace(url);
    }
  </script>
</body>
</html>
