<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OVERHUE 다운로드</title>
  <meta name="description" content="OVERHUE를 App Store 또는 Google Play에서 받으세요." />
  <meta name="theme-color" content="#ebe0d2" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      color: #2a241c;
      font-family: "IBM Plex Sans KR", "Hiragino Sans", "PingFang SC", "Microsoft YaHei", "Yu Gothic", sans-serif;
      background:
        radial-gradient(720px 440px at 50% -12%, #fffaf3, transparent 58%),
        linear-gradient(180deg, #f4ebe0 0%, #ebe0d2 100%);
    }
    main {
      width: min(420px, 100%);
      padding: 36px 28px 28px;
      border-radius: 28px;
      background: #fffdf8;
      box-shadow: 0 14px 40px rgba(60, 42, 20, .10);
      text-align: center;
    }
    h1 {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-size: 40px;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    .tag { margin: 10px 0 0; color: #7a7064; font-size: 15px; line-height: 1.5; }
    .status { min-height: 22px; margin: 18px 0 0; color: #8a6a00; font-size: 14px; }
    .stores { display: grid; gap: 10px; margin-top: 8px; }
    a.store {
      display: block;
      padding: 12px 16px;
      border-radius: 18px;
      background: #2a241c;
      color: #fffdf8;
      text-decoration: none;
    }
    a.store span { display: block; font-size: 12px; opacity: 0.72; }
    a.store strong { display: block; margin-top: 2px; font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>OVERHUE</h1>
    <p class="tag" id="tag">종이 위에 물감을 겹쳐 칠하는 색 퍼즐</p>
    <p class="status" id="status"></p>
    <div class="stores">
      <a class="store" id="ios" href="https://apps.apple.com/app/overhue/id6817478231">
        <span class="dl">다운로드</span>
        <strong>App Store</strong>
      </a>
      <a class="store" id="android" href="https://play.google.com/store/apps/details?id=com.overhue.feel">
        <span class="dl">다운로드</span>
        <strong>Google Play</strong>
      </a>
    </div>
  </main>
  <script>
    const COPY = {
      ko: {
        htmlLang: "ko",
        title: "OVERHUE 다운로드",
        description: "OVERHUE를 App Store 또는 Google Play에서 받으세요.",
        tag: "종이 위에 물감을 겹쳐 칠하는 색 퍼즐",
        download: "다운로드",
        opening: "{store}로 이동하고 있어요",
      },
      en: {
        htmlLang: "en",
        title: "Download OVERHUE",
        description: "Get OVERHUE on the App Store or Google Play.",
        tag: "A color puzzle of overlapping paint on paper",
        download: "Download",
        opening: "Opening the {store}",
      },
      ja: {
        htmlLang: "ja",
        title: "OVERHUE をダウンロード",
        description: "App Store または Google Play で OVERHUE を入手できます。",
        tag: "紙の上に絵の具を重ねて塗る色パズル",
        download: "ダウンロード",
        opening: "{store}を開いています",
      },
      "zh-CN": {
        htmlLang: "zh-CN",
        title: "下载 OVERHUE",
        description: "在 App Store 或 Google Play 获取 OVERHUE。",
        tag: "在纸上叠着颜料涂的色谜题",
        download: "下载",
        opening: "正在打开 {store}",
      },
      "zh-TW": {
        htmlLang: "zh-TW",
        title: "下載 OVERHUE",
        description: "在 App Store 或 Google Play 取得 OVERHUE。",
        tag: "在紙上疊著顏料塗的色謎題",
        download: "下載",
        opening: "正在打開 {store}",
      },
      es: {
        htmlLang: "es",
        title: "Descargar OVERHUE",
        description: "Consigue OVERHUE en App Store o Google Play.",
        tag: "Un puzzle de color pintando a capas sobre papel",
        download: "Descargar",
        opening: "Abriendo {store}",
      },
      "pt-BR": {
        htmlLang: "pt-BR",
        title: "Baixar OVERHUE",
        description: "Baixe OVERHUE na App Store ou no Google Play.",
        tag: "Um puzzle de cor pintando em camadas no papel",
        download: "Baixar",
        opening: "Abrindo {store}",
      },
    };
    const SPANISH = new Set(["ES", "MX", "AR", "CO", "CL", "PE", "VE", "EC", "GT", "CU", "BO", "DO", "HN", "PY", "SV", "NI", "CR", "PA", "UY", "PR"]);
    const params = new URLSearchParams(location.search);

    function country() {
      const query = (params.get("cc") || "").toUpperCase();
      if (/^[A-Z]{2}$/.test(query)) return query;
      const saved = document.cookie.match(/(?:^|; )oh_cc=([A-Za-z]{2})/);
      if (saved) return saved[1].toUpperCase();
      const region = (navigator.language || "").split("-")[1];
      if (region && /^[A-Za-z]{2}$/.test(region)) return region.toUpperCase();
      return "";
    }

    function languageFromTag(tag) {
      const value = (tag || "").toLowerCase();
      if (value.startsWith("ko")) return "ko";
      if (value.startsWith("ja")) return "ja";
      if (value.startsWith("zh")) {
        if (value.includes("tw") || value.includes("hk") || value.includes("hant")) return "zh-TW";
        return "zh-CN";
      }
      if (value.startsWith("es")) return "es";
      if (value.startsWith("pt")) return "pt-BR";
      return "en";
    }

    function languageFor(code) {
      const query = params.get("lang");
      if (query && COPY[query]) return query;
      if (code === "KR") return "ko";
      if (code === "JP") return "ja";
      if (code === "CN") return "zh-CN";
      if (code === "TW" || code === "HK" || code === "MO") return "zh-TW";
      if (SPANISH.has(code)) return "es";
      if (code === "BR" || code === "PT") return "pt-BR";
      if (code) return "en";
      return languageFromTag(navigator.language);
    }

    function appleUrl(code) {
      if (!/^[A-Z]{2}$/.test(code)) return "https://apps.apple.com/app/overhue/id6817478231";
      const store = code === "GB" ? "uk" : code.toLowerCase();
      return "https://apps.apple.com/" + store + "/app/overhue/id6817478231";
    }

    function playUrl(code, lang) {
      const hl = COPY[lang] ? COPY[lang].htmlLang : "en";
      const query = new URLSearchParams({ id: "com.overhue.feel", hl: hl });
      if (/^[A-Z]{2}$/.test(code)) query.set("gl", code);
      return "https://play.google.com/store/apps/details?" + query.toString();
    }

    const where = country();
    const lang = languageFor(where);
    const copy = COPY[lang];
    const iosUrl = appleUrl(where);
    const androidUrl = playUrl(where, lang);
    document.documentElement.lang = copy.htmlLang;
    document.title = copy.title;
    const description = document.querySelector('meta[name="description"]');
    if (description) description.setAttribute("content", copy.description);
    document.getElementById("tag").textContent = copy.tag;
    document.querySelectorAll(".dl").forEach(function (node) {
      node.textContent = copy.download;
    });
    document.getElementById("ios").href = iosUrl;
    document.getElementById("android").href = androidUrl;

    function device() {
      const forced = params.get("os");
      if (forced === "ios" || forced === "android") return forced;
      const ua = navigator.userAgent || "";
      const ipad = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      if (/iPhone|iPad|iPod/i.test(ua) || ipad) return "ios";
      if (/Android/i.test(ua)) return "android";
      return "desktop";
    }

    const os = device();
    if (os === "ios" || os === "android") {
      const storeName = os === "ios" ? "App Store" : "Google Play";
      document.getElementById("status").textContent = copy.opening.replace("{store}", storeName);
      if (!params.has("stay")) location.replace(os === "ios" ? iosUrl : androidUrl);
    }
  </script>
</body>
</html>
